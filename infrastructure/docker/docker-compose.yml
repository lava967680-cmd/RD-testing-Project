version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: controlhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-controlhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-controlhub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlhub -d controlhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: controlhub-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: services/api/Dockerfile
    container_name: controlhub-api
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: "postgres://${POSTGRES_USER:-controlhub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@postgres:5432/${POSTGRES_DB:-controlhub_db}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ../../
      dockerfile: services/realtime/Dockerfile
    container_name: controlhub-realtime
    restart: unless-stopped
    environment:
      PORT: "8081"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  admin-console:
    build:
      context: ../../apps/admin-console
      dockerfile: Dockerfile
    container_name: controlhub-admin-console
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
      - realtime

volumes:
  pgdata:
  redisdata:
