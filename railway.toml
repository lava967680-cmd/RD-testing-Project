# Railway Deployment Configuration
# Railway.app automatically reads this file and deploys your backend

[build]
builder = "DOCKERFILE"
dockerfilePath = "infrastructure/docker/Dockerfile.api"

[deploy]
startCommand = "./controlhub-api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "controlhub-api"
