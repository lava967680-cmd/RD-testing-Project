name: Build & Release ControlHub

# Automatically runs when you push to GitHub
# Builds the Windows Agent .exe and publishes it as a downloadable release

on:
  push:
    tags:
      - 'v*'           # Triggers on version tags like v1.0.0, v1.1.0
  workflow_dispatch:   # Also allows manual trigger from GitHub website

jobs:

  # ─────────────────────────────────────────────────────────
  # JOB 1: Build Windows Agent .exe (Rust)
  # ─────────────────────────────────────────────────────────
  build-windows-agent:
    name: Build Windows Agent
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/windows-agent/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/windows-agent/Cargo.lock') }}

      - name: Build Release Binary
        working-directory: apps/windows-agent
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Copy binary to installer/build/
        run: |
          New-Item -ItemType Directory -Force -Path installer/build
          Copy-Item apps/windows-agent/target/x86_64-pc-windows-msvc/release/controlhub-agent.exe installer/build/

      - name: Download Inno Setup
        run: |
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile innosetup.exe
          Start-Process -Wait -FilePath innosetup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART"

      - name: Build Installer .exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/agent-setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlHub-Agent-Setup
          path: installer/dist/ControlHub-Agent-Setup.exe

  # ─────────────────────────────────────────────────────────
  # JOB 2: Build Go API Backend
  # ─────────────────────────────────────────────────────────
  build-api:
    name: Build Go API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/api/go.sum

      - name: Build API binary
        working-directory: services/api
        run: |
          go build -o controlhub-api ./cmd/server/
          echo "✅ API binary built successfully"

      - name: Run all tests
        working-directory: services/api
        run: go test ./... -v

  # ─────────────────────────────────────────────────────────
  # JOB 3: Build Admin Console (React)
  # ─────────────────────────────────────────────────────────
  build-console:
    name: Build Admin Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/admin-console/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin-console
        run: npm ci

      - name: Build production bundle
        working-directory: apps/admin-console
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.API_URL }}

      - name: Upload console build
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-dist
          path: apps/admin-console/dist/

  # ─────────────────────────────────────────────────────────
  # JOB 4: Create GitHub Release with download links
  # ─────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-windows-agent, build-api, build-console]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download agent installer
        uses: actions/download-artifact@v4
        with:
          name: ControlHub-Agent-Setup

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ControlHub ${{ github.ref_name }}
          body: |
            ## ControlHub ${{ github.ref_name }}

            ### 📥 Download for Clients
            Download **ControlHub-Agent-Setup.exe** below and send it to your clients.

            ### Installation Instructions for Clients
            1. Download `ControlHub-Agent-Setup.exe`
            2. Double-click to run
            3. Enter the enrollment token from your Admin Console
            4. Click Install — done! ✅

            ### Admin Console
            Access your dashboard at: https://controlhub-yourname.vercel.app
          files: ControlHub-Agent-Setup.exe
          draft: false
          prerelease: false
